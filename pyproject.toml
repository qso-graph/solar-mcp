[project]
name = "solar-mcp"
version = "0.5.0"
description = "MCP server for solar indices and space weather — SFI, SSN, Kp, DSCOVR, alerts"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "certifi>=2026.10.19",
]
keywords = [
    "amateur-radio", "ham-radio", "solar", "space-weather", "sfi", "kp-index",
    "mcp", "model-context-protocol", "noaa", "dscovr", "propagation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/solar/"
Repository = "https://github.com/qso-graph/solar-mcp"
Issues = "https://github.com/qso-graph/solar-mcp/issues"

[project.scripts]
solar-mcp = "solar_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it was deferred here while the rules that find defects
# went in first (qso-graph-devel#70). That pass has now happened for this repo
# (#30): it reported 20 lines, none of them a defect, and all but one reflowed
# without a name being shortened.
#
# The exception is explicit rather than silent. One line in client.py carries
# NOAA's own alert text, newlines included, as the thing the parser has to
# read; its shape is the point, so it holds a `# noqa: E501` with the reason
# written above it. Where a line is long because it names a publisher's field
# exactly, the length is the correctness — this project's rule is that the
# owner of a list is its authority, so we use the publisher's names and not
# shorter ones of our own.
select = ["E", "F", "I"]
ignore = []
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
